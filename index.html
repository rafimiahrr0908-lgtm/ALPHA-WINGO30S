<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHA DEVOLOPER ASM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #000;
            color: #00ff00;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            user-select: none;
        }
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.97)), 
                        url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1000') no-repeat center center/cover;
            opacity: 0.12;
            z-index: -1;
        }
        .terminal-box {
            background: rgba(5, 15, 5, 0.9);
            border: 2px solid #00ff00;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.3);
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            position: relative;
            margin-bottom: 20px;
            text-align: center;
        }
        .terminal-header {
            border-bottom: 1px dashed #00ff00;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: left;
        }
        h2 {
            margin-bottom: 15px;
            font-size: 20px;
            text-shadow: 0 0 5px #00ff00;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #00ff00;
            border-radius: 4px;
            background-color: #000;
            color: #00ff00;
            font-size: 14px;
            outline: none;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #00ff00;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #00cc00;
            box-shadow: 0 0 15px #00ff00;
        }
        .pred-val {
            font-size: 50px;
            font-weight: 900;
            margin: 10px 0;
            text-shadow: 0 0 20px #00ff00;
        }
        /* Small Telegram Channel Button */
        .btn-telegram {
            display: inline-block;
            width: auto;
            padding: 8px 18px;
            background: linear-gradient(45deg, #0088cc, #005588);
            border: 1px solid #00ff00;
            border-radius: 20px;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 15px;
            box-shadow: 0 0 10px rgba(0, 136, 204, 0.4);
        }
        .btn-telegram:hover {
            box-shadow: 0 0 15px #00ff00;
        }
        .get-pass-link {
            display: block;
            margin-top: 12px;
            font-size: 12px;
            color: #00ff00;
            text-decoration: underline;
            cursor: pointer;
        }
        .history-box {
            background: rgba(5, 10, 5, 0.95);
            border: 2px solid #00ff00;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #00ff00;
            padding: 8px;
            text-align: center;
        }
        th { background-color: rgba(0, 255, 0, 0.1); color: #00ff00; }
        .win { color: #00ff00; font-weight: bold; }
        .loss { color: #ff3333; font-weight: bold; }
        .hidden { display: none; }
        .error-msg { color: #ff3333; font-size: 12px; margin-top: 8px; line-height: 1.4; }
        .footer-branding { margin-top: 15px; font-size: 12px; letter-spacing: 2px; color: #00ff00; text-shadow: 0 0 5px #00ff00; }
    </style>
</head>
<body>

<div class="matrix-bg"></div>

<div class="terminal-box">
    <div class="terminal-header">> ALPHA_DEV@SECURE_SYSTEM:~#</div>

    <!-- Login Section -->
    <div id="loginPage">
        <h2>[ ACCESS REQUIRED ]</h2>
        <div class="input-group">
            <label>ENTER ACCESS PASSWORD:</label>
            <input type="password" id="passInput" placeholder="PASSWORD HERE..." autocomplete="off">
        </div>
        <button onclick="attemptLogin()">VERIFY KEY</button>
        <div id="loginError" class="error-msg hidden"></div>
        <a class="get-pass-link" href="https://t.me/ALPHA_AXR" target="_blank">Get Password from @ALPHA_AXR</a>
    </div>

    <!-- Server Offline View -->
    <div id="serverOffPage" class="hidden">
        <h2 style="color: #ff3333;">[ SERVER OFFLINE ]</h2>
        <p style="color: #ccc; font-size: 13px; margin-top: 10px;">The system is currently undergoing maintenance.</p>
    </div>

    <!-- App Dashboard Section -->
    <div id="appPage" class="hidden">
        <h2>ALPHA DEVOLOPER ASM</h2>
        <div style="color: #aaa; font-size: 12px;" id="pID">PERIOD: ---</div>
        <div class="pred-val" id="pRes">WAIT...</div>
        <div style="color: #ffff00; font-size: 12px; font-weight: bold; border:1px dashed #ffff00; padding:6px; margin-top:10px;" id="pOpps">SYNCING...</div>
    </div>
</div>

<!-- History Section -->
<div id="historyContainer" class="history-box hidden">
    <h2 style="font-size: 15px; text-align: center;">[ LIVE TRANSMISSION HISTORY ]</h2>
    <table>
        <thead><tr><th>PRD</th><th>PRED</th><th>NUM</th><th>STATUS</th></tr></thead>
        <tbody id="logs"></tbody>
    </table>
    <div style="text-align: center;">
        <a href="https://t.me/paymentusdt00" target="_blank" class="btn-telegram">JOIN TELEGRAM CHANNEL</a>
    </div>
</div>

<div class="footer-branding">ALPHA DEVOLOPER ASM</div>

<script>
    const DB_URL = "https://wingo30s1-default-rtdb.firebaseio.com/";
    const BIG_POOL = [5,6,7,8,9], SMALL_POOL = [0,1,2,3,4];
    let currentOpposites = [];
    let heartbeatTimer = null;

    function getDeviceToken() {
        let token = localStorage.getItem('app_device_token');
        if (!token) {
            token = 'dev_' + Math.random().toString(36).substr(2, 9) + Date.now();
            localStorage.setItem('app_device_token', token);
        }
        return token;
    }

    async function attemptLogin() {
        const enteredPass = document.getElementById('passInput').value.trim();
        const errDiv = document.getElementById('loginError');
        errDiv.classList.add('hidden');

        if (!enteredPass) {
            errDiv.innerText = "Please enter password!";
            errDiv.classList.remove('hidden');
            return;
        }

        try {
            const statusRes = await fetch(`${DB_URL}/serverStatus.json`);
            const isServerOn = await statusRes.json();
            if (isServerOn === false) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('serverOffPage').classList.remove('hidden');
                return;
            }

            const mainPassRes = await fetch(`${DB_URL}/mainPassword.json`);
            let mainPass = await mainPassRes.json();
            if(!mainPass) mainPass = "ALPHAH2";

            const myToken = getDeviceToken();

            if (enteredPass === mainPass) {
                grantAccess();
                return;
            }

            const tempRes = await fetch(`${DB_URL}/tempPasswords/${enteredPass}.json`);
            const tempObj = await tempRes.json();

            if (tempObj) {
                const now = Date.now();
                if (now > tempObj.expiresAt) {
                    errDiv.innerText = "Password expired! Get new password from @ALPHA_AXR";
                    errDiv.classList.remove('hidden');
                    return;
                }

                if (tempObj.usedBy && tempObj.usedBy !== myToken) {
                    errDiv.innerText = "Already used on another device! Get password from @ALPHA_AXR";
                    errDiv.classList.remove('hidden');
                    return;
                }

                await fetch(`${DB_URL}/tempPasswords/${enteredPass}/usedBy.json`, {
                    method: 'PUT',
                    body: JSON.stringify(myToken)
                });

                grantAccess();
                return;
            }

            errDiv.innerHTML = 'Wrong password! <br><a href="https://t.me/ALPHA_AXR" target="_blank" style="color:#00ff00;">Get password from @ALPHA_AXR</a>';
            errDiv.classList.remove('hidden');

        } catch(e) {
            errDiv.innerText = "Network Error! Check Connection.";
            errDiv.classList.remove('hidden');
        }
    }

    function grantAccess() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('appPage').classList.remove('hidden');
        document.getElementById('historyContainer').classList.remove('hidden');
        runLogic();
        startHeartbeat();
    }

    function startHeartbeat() {
        const sessionID = 'user_' + Math.random().toString(36).substr(2, 9);
        const sendPulse = () => {
            fetch(`${DB_URL}/liveUsers/${sessionID}.json`, {
                method: 'PUT',
                body: JSON.stringify(Date.now())
            }).catch(() => {});
        };
        sendPulse();
        heartbeatTimer = setInterval(sendPulse, 10000);
    }

    async function runLogic() {
        setInterval(async () => {
            try {
                const sCheck = await fetch(`${DB_URL}/serverStatus.json`);
                const serverStatus = await sCheck.json();
                if (serverStatus === false) {
                    document.getElementById('appPage').classList.add('hidden');
                    document.getElementById('historyContainer').classList.add('hidden');
                    document.getElementById('serverOffPage').classList.remove('hidden');
                    if (heartbeatTimer) clearInterval(heartbeatTimer);
                    return;
                }

                const res = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json');
                const json = await res.json();
                const latest = json.data.list[0];
                const trend = json.data.list.slice(0, 3).map(x => parseInt(x.number) >= 5 ? "BIG" : "SMALL");
                const nextPred = trend.filter(x => x === "BIG").length > 1 ? "BIG" : "SMALL";

                if(window.lastId !== latest.issueNumber) {
                    const actualSize = parseInt(latest.number) >= 5 ? "BIG" : "SMALL";
                    let checkAgainst = window.savedPrediction || nextPred;
                    
                    const sameSide = checkAgainst === "BIG" ? BIG_POOL : SMALL_POOL;
                    const oppSide = checkAgainst === "BIG" ? SMALL_POOL : BIG_POOL;
                    
                    const num1 = sameSide[Math.floor(Math.random() * sameSide.length)];
                    const num2 = oppSide[Math.floor(Math.random() * oppSide.length)];
                    currentOpposites = [num1, num2];

                    if(window.lastId) {
                        const isWin = (checkAgainst === actualSize) || window.savedOpps.includes(parseInt(latest.number));
                        const statusText = isWin ? 'WIN ✅' : 'LOSS ❌';
                        const row = `<tr><td>${latest.issueNumber.slice(-3)}</td><td>${checkAgainst}</td><td>${latest.number}</td><td class="${isWin?'win':'loss'}">${statusText}</td></tr>`;
                        document.getElementById('logs').innerHTML = row + document.getElementById('logs').innerHTML;
                    }
                    window.lastId = latest.issueNumber;
                    window.savedPrediction = nextPred;
                    window.savedOpps = currentOpposites;
                }
                document.getElementById('pID').innerText = "PERIOD: " + (BigInt(latest.issueNumber) + 1n).toString();
                document.getElementById('pRes').innerText = nextPred;
                document.getElementById('pOpps').innerText = "NUMBERS: " + currentOpposites.join(", ");
            } catch(e) {}
        }, 3000);
    }
</script>
</body>
</html>
